<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>吉祥寺はしごパスポート</title>
<link rel="stylesheet" href="style.css?v=20261025s">
</head>
<body>
<main class="wrap">
  <div id="loading" class="loading">パスポートを開いています…</div>

  <div id="error" class="hidden">
    <div class="card"><p id="error-text"></p></div>
  </div>

  <div id="app" class="hidden">
    <section class="pass-cover">
      <div id="emblem"></div>
      <p class="pass-area serif">吉祥寺</p>
      <h1 class="serif">はしごパスポート</h1>
      <p class="pass-en">KICHIJOJI HASHIGO PASSPORT</p>
      <p class="pass-holder hidden" id="holder"><span>NAME</span><b id="holder-name"></b></p>
      <p class="pass-count" id="count"></p>
    </section>
    <section class="card daishi pass-page">
      <ul class="stamp-grid" id="grid"></ul>
      <p class="muted small" id="empty-note" hidden>紹介状を持ってお店に行き、店内のQRコードを読むと、最初のスタンプが押されます。</p>
    </section>
    <section class="card hidden" id="issue-box"></section>
    <p class="notice view-only hidden" id="view-only">このパスポートは見るだけです。このスマホでスタンプを押すと、あなた自身のパスポートになります。</p>

    <details class="card howto hidden" id="keep">
      <summary>
        <span class="howto-title">このパスポートをとっておく</span>
        <span class="howto-sub">なくしたら再発行です。ブックマークか、LINEのKeepメモに</span>
      </summary>
      <div class="howto-body" id="keep-body"></div>
    </details>
  </div>

  <p class="foot">行きつけの紹介状 by banzai（試験運用中）</p>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js?v=20261025s"></script>
<script src="common.js?v=20261025s"></script>
<script>
(function () {
  var S = window.Shokaijo;
  var id = S.param('c');
  function $(x) { return document.getElementById(x); }
  function show(x) {
    ['loading', 'error', 'app'].forEach(function (k) { $(k).classList.toggle('hidden', k !== x); });
  }

  // 表紙とスタンプ面を描く。own は「このスマホのパスポート」か
  function draw(p, own) {
    var stamps = p.stamps || [];
    $('emblem').innerHTML = S.passEmblem();
    $('holder').classList.toggle('hidden', !p.name);
    $('holder-name').textContent = p.name || '';
    var html = stamps.map(S.stampHtml).join('');
    // 押していない枠も並べて、パスポートらしく見せる（6つ単位）
    var slots = Math.max(6, Math.ceil((stamps.length + 1) / 6) * 6) - stamps.length;
    for (var i = 0; i < slots; i++) html += '<li class="stamp-cell empty" aria-hidden="true"><div class="hanko"></div></li>';
    $('grid').innerHTML = html;
    $('count').textContent = stamps.length ? 'スタンプ ' + stamps.length + '個' : 'まだスタンプはありません';
    $('empty-note').hidden = stamps.length > 0;
    $('view-only').classList.toggle('hidden', own || !p.issued);
    // 発行済みの自分のパスポートだけ、とっておく案内を出す
    var keep = own && p.issued;
    $('keep').classList.toggle('hidden', !keep);
    if (keep) {
      $('keep-body').innerHTML = S.keepBoxHtml(p.id) +
        '<details class="rename"><summary>ニックネームを変える</summary><div id="rename-box"></div></details>';
      S.bindKeepBox($('keep-body'));
      // 名前を変えられるのは、鍵を持っているこのスマホだけ
      $('rename-box').innerHTML = S.issueFormHtml('rename');
      S.bindIssueForm($('rename-box'), p.name, function (r) {
        draw(r, true);
        $('keep').open = true;
        S.toast('ニックネームを変えました');
      });
    }
    // 未発行で、スタンプがある：ここで発行できる
    var canIssue = own && !p.issued && stamps.length > 0;
    $('issue-box').classList.toggle('hidden', !canIssue);
    if (canIssue) {
      $('issue-box').innerHTML = S.issueFormHtml();
      S.bindIssueForm($('issue-box'), '', function (r) {
        // 発行したら、見るためのURLに切り替える（ブックマークしてもらうため）
        history.replaceState(null, '', S.cardUrl(r.id));
        draw(r, true);
        $('keep').open = true;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
    show('app');
  }

  function fail(err) {
    $('error-text').textContent = S.message(err);
    show('error');
  }

  if (id) {
    // 見るためのURL：だれでも見られる。このスマホの鍵の公開IDと同じなら、自分のもの
    Promise.all([S.get({ action: 'card', card: id }), S.myPass().catch(function () { return null; })])
      .then(function (r) { draw(r[0], !!(r[1] && r[1].id === id)); })
      .catch(fail);
  } else {
    // URLなし：このスマホのパスポート。鍵がなければ白紙
    S.myPass().then(function (p) {
      if (p && p.issued) history.replaceState(null, '', S.cardUrl(p.id));
      draw(p || { stamps: [], issued: false }, !!p);
    }).catch(fail);
  }
})();
</script>
</body>
</html>
